<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panoramic Image Viewer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.1/howler.min.js"></script>
</head>
<body>
    <div class="image-container">
        <img src="https://cdn.glitch.global/1f4974dd-91a5-42c3-81d9-08f002eea6da/image_app_Sunny_September.jpg?v=1716411655241" alt="Panoramic Image" id="panoramic-image">
        <div id="scroll-position" style="position: absolute; top: 10px; color: white; background: rgba(0, 0, 0, 0.5); padding: 5px; border-radius: 5px;">0</div>
    </div>
    <div id="play-message" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 5px; text-align: center; cursor: pointer;">
        Commencez votre expérience
    </div>
    <script src="script.js"></script>
</body>
</html>
